<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | Chetan Teli</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/responsive.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;
    background:radial-gradient(circle at 20% 20%,rgba(109,94,252,0.14),transparent 45%),
               radial-gradient(circle at 80% 80%,rgba(179,79,240,0.12),transparent 45%),var(--bg-void);}
  .error-wrap{padding:32px;max-width:560px;}
  .error-code{font-family:var(--font-mono);font-size:clamp(4rem,14vw,7rem);font-weight:700;
    background:var(--gradient);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1;}
  .error-wrap h1{margin:18px 0 12px;font-size:1.5rem;}
  .error-wrap p{color:var(--text-mid);margin-bottom:32px;}
  .error-code-line{font-family:var(--font-mono);font-size:.85rem;color:var(--text-low);
    background:var(--glass);border:1px solid var(--glass-border);border-radius:10px;padding:14px 18px;margin-bottom:32px;text-align:left;}
</style>
</head>
<body>
  <div class="error-wrap">
    <div class="error-code">404</div>
    <div class="error-code-line">Exception in thread "main": PageNotFoundException — route does not exist.</div>
    <h1>This page took a wrong turn.</h1>
    <p>The page you're looking for doesn't exist or may have moved. Let's get you back on track.</p>
    <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> Back to Home</a>
  </div>
</body>
</html>
